<div id="msgcns!41A371CF62CE9156!289" class="bvMsg"> <div> “我怎么修改食谱才能不放盐？” </div> <div> </div> <div>厨师长回答， “你怎么敢侮辱我的食谱， 我的智力和味觉的产物，试图擅自修改呢？你没有决断力改变我的食谱，按照正常去做。” </div> <p>“但是我的医生不允许我吃盐！我该怎么办？你会为了我而不放盐吗？” </p> <p>“我会很高兴去做；我的费用仅是五万美元。” 因为所有者有修改的专利权， 费用有些高了。 “然而，现在我没有时间。我忙於工作， 为海军设计一个饼干的新食谱。 大约两年后才可能有空。” </p> </div>
