<p>#西雅图冬天 能干嘛？肯定是躲家里diy。<br>换坐厕，美缝水泥，刷漆，玻璃门，改灯和marketplace 淘的旧木镜子。大概两三个星期的业余时间就搞完了。</p><p>设计上基本全程咨询chatgpt 。它说原本的问题是墙太白，镜子太矮。需要拉高垂直空间感，和刷水泥灰色的漆把墙视觉后退化。水泥灰日光下表现不错，但是灯光下一般般。如果重做的话，我还是偏爱稍微橙绿色的漆。<br>#中古风 #midcenturymodern</p><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00831si2busd62605n5umjl5ua4bvhuv1b0?imageView2/2/w/1600" width="1928" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/notes_uhdr/1040g3qg31skm5v22ls605n5umjl5ua4bdgcm1io?imageView2/2/w/1600" width="3072" height="4080"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g2sg31shnjfqa5kbg5n5umjl5ua4buv1ifk0?imageView2/2/w/1600" width="2560" height="1928"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00831si2busd62505n5umjl5ua4bgku2dho?imageView2/2/w/1600" width="1928" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/notes_uhdr/1040g3qo31shnjfq75m905n5umjl5ua4bct754m0?imageView2/2/w/1600" width="3072" height="4080"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g2sg31shnjfqa5kb05n5umjl5ua4bi03jrv8?imageView2/2/w/1600" width="1920" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/notes_uhdr/1040g3qg31si2butf62505n5umjl5ua4b4r7qm3o?imageView2/2/w/1600" width="4080" height="3072"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/note_pre_post_uhdr/1040g3r831shnjfqc62bg5n5umjl5ua4b8nsbp4g?imageView2/2/w/1600" width="3072" height="4080"></figure><figure><img lo
