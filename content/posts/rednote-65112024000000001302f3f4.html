<p>从#本田cbr500r 换车到#883sportster 刚好满一年。<br>低转速下的加速更加给力，但是引擎3000转后震动明显比不上本田的顺滑。重心低，轮子大，直线加速稳如老狗。</p><p>转小弯，倒头很容易失败，只能慢吞吞三点式转。但是车重比CBR多了将近100斤，倒车遇到斜坡只能满头大汗不断靠压前叉来挪。</p><p>高速非常稳。估计得益于金属材质够。感觉哈雷的车的确瓷实，比起本田的塑料感，无论是抗风还是抗震都好不少。不过和rebel1200比的话又好像差不了太多，和CBR500应该本来就不是同一档的货。<br>#摩托车骑行 #哈雷 #摩托车分享 #西雅图 #秋季</p><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00830pedd3623o6g5n5umjl5ua4brboqlg0?imageView2/2/w/1600" width="2560" height="1920"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00830pedd3623o405n5umjl5ua4b6mehd1g?imageView2/2/w/1600" width="1920" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00830pedd3623o3g5n5umjl5ua4b4v37ka0?imageView2/2/w/1600" width="2560" height="1920"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00830pedd3623o305n5umjl5ua4b7o5v35o?imageView2/2/w/1600" width="1920" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00830pedd3623o1g5n5umjl5ua4bevprmh0?imageView2/2/w/1600" width="2560" height="1920"></figure>
