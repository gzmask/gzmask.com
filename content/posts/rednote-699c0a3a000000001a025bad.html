<p>周末淘了几件实木二手家具。其实宜家很环保，设计感也算在线，为什么开始失去市场？之所以会去淘旧家具而不是买宜家，其实还是因为家具也不只是设计+实用两个方面这么简单的事情。小朋友长高的标记，磕磕碰碰的伤痕，坏了又修好的补丁，食物油迹包浆，它们其实是在家庭这个空间里的记忆承载物。在宜家的系统里面这些因素并没有进入设计师的视野。几年一换，总是崭新的宜家式装修，回头一看，会感觉发生了很多事情，看起来却好像什么也没发生过。我认为这种失落感渐渐让宜家失去了市场。#美能达手动镜头 Minolta 50mm F1.4</p><p>#midcenturymodern #大光圈的魅力 #宜家家居关门</p><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00831su2lt31lk505n5umjl5ua4b9jojpno?imageView2/2/w/1600" width="1704" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00831su2lt31lk3g5n5umjl5ua4b6p4l0n8?imageView2/2/w/1600" width="1704" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00831su2lt31lk4g5n5umjl5ua4bv6lq6j0?imageView2/2/w/1600" width="1704" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00831su2lt31lk0g5n5umjl5ua4bl0p7df0?imageView2/2/w/1600" width="1704" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00831su2lt31lk6g5n5umjl5ua4b0jqnjf0?imageView2/2/w/1600" width="1704" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00831su2lt31lk2g5n5umjl5ua4bi1l3cpo?imageView2/2/w/1600" width="1704" height="2560"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/1040g00831su2lt31lk305n5umjl5ua4bmb7viug?imageView2/2/w/1600" width="2560" height="1704"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/spectrum/1040g34o31su2bfv4568g5n5umjl5ua4bmb8qak0?imageView2/2/w/1600" width="3264" hei
