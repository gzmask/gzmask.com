<p>离开加拿大回广州</p><p>自从看到珠三角成为世界第一大的城市群的新闻，我的心情就开始了骚动。作为一个出生于珠三角，成长于珠三角的地道广州人，来到了加拿大这个地方，总是在念想回归故里后的情景。</p><p>机会总是在无法预测的时候降临。汇丰在广州的分部贴的招骋吸引了我，于是投了简历。我拿到了offer。</p><p>妻子这时意外怀上了。回国对生育的不利因素并不能扺消我一心要回国的冲动，于是我收拾好行李，辞职并开始了新的征途。</p><p>过程并不简单。搬家去温哥华，到香港办理登证，取消中国户籍，让整个过程异常忙碌。</p><p>最终我还是顺利的开始了归国的历程。</p><figure><img loading="lazy" decoding="async" alt="" src="/media/1b2af4de6b10-01.jpg" /></figure>
