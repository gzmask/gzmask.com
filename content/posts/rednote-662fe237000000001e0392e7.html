<p>#哈雷883</p><p>两年的陪伴，告别883L。</p><p>终于还是决定换车。上周买家来骑走了（图二）。<br>883的确好骑，穿街走巷神器，车流之间穿插非常方便，而且上高速也是稳如老狗。这是一台能兼顾大多数情况的好车。<br>但是它的问题也很突出，就是非常低的车架离地高度，和非常低的倾角。这两者结合会完全改变骑手骑车风格，成为那种“哈雷”型骑手。这可能是非常好的最后一辆车，但是这背离我骑车的初衷，也是我最后决定换的原因。毕竟骑车是为了远方，而不是铺装。</p><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/spectrum/1040g34o3126e7n5f4o005n5umjl5ua4bjjmg860?imageView2/2/w/1600" width="1280" height="1706"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/spectrum/1040g0k03126ea3vj4u005n5umjl5ua4bders5q0?imageView2/2/w/1600" width="480" height="270"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/spectrum/1040g0k03126e7mid50005n5umjl5ua4b4j2u9g0?imageView2/2/w/1600" width="1280" height="960"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/spectrum/1040g34o3126e7obtku005n5umjl5ua4bf478r90?imageView2/2/w/1600" width="1280" height="960"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/spectrum/1040g34o3126e7movks005n5umjl5ua4blu29bmg?imageView2/2/w/1600" width="1280" height="1706"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/spectrum/1040g0k03126e7nnl4u005n5umjl5ua4b2l6q8a8?imageView2/2/w/1600" width="1280" height="1706"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/spectrum/1040g34o3126e7nuo4o005n5umjl5ua4bbsaed7o?imageView2/2/w/1600" width="1280" height="960"></figure><figure><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="https://sns-img-qc.xhscdn.com/spectrum/1040g34o3126e7mv74u005n5umjl5ua4b885dcr0?imageView2/2/w/1600" width="1280" heigh
